openapi: 3.0.3
info:
  title: Swap Platform API
  version: 2.0.0
  description: |
    REST API of the Reputation Swap platform (Go + Fiber + PostgreSQL).

    * Money is always an integer number of **kopecks** (1 ruble = 100 kopecks).
    * Percentages are **basis points**: 10000 = 100%, 3740 = 37.4%.
    * Log in with `POST /auth/login`, copy `access_token`, press **Authorize** and paste it.
      The access token lives 15 minutes; the refresh token is an HttpOnly cookie.
servers:
  - url: /api

tags:
  - name: health
  - name: auth
  - name: users
  - name: projects
  - name: predictions
  - name: wallet
  - name: swaps
  - name: reputation

paths:
  /health:
    get:
      tags: [health]
      summary: Is the server and the database up?
      responses:
        '200':
          description: Everything works
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Health' }
        '503':
          description: The database does not answer
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Health' }

  /auth/register:
    post:
      tags: [auth]
      summary: Create an account (also logs in)
      description: At most 10 requests per minute from one IP address.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterInput' }
      responses:
        '201':
          description: Account created. The refresh token is set as a cookie.
          headers:
            Set-Cookie: { $ref: '#/components/headers/RefreshCookie' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /auth/login:
    post:
      tags: [auth]
      summary: Log in with email and password
      description: At most 10 requests per minute from one IP address.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginInput' }
      responses:
        '200':
          description: Logged in. The refresh token is set as a cookie.
          headers:
            Set-Cookie: { $ref: '#/components/headers/RefreshCookie' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /auth/refresh:
    post:
      tags: [auth]
      summary: New access token from the refresh cookie
      description: |
        Every refresh token works only once (rotation). Using an old one again
        is treated as theft and ends all sessions of the user.
      security:
        - refreshCookie: []
      responses:
        '200':
          description: New tokens. The cookie is replaced.
          headers:
            Set-Cookie: { $ref: '#/components/headers/RefreshCookie' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /auth/logout:
    post:
      tags: [auth]
      summary: End the session (deletes the refresh token and the cookie)
      security:
        - refreshCookie: []
      responses:
        '204':
          description: Logged out

  /auth/me:
    get:
      tags: [auth]
      summary: The logged-in user
      security:
        - bearerAuth: []
      responses:
        '200':
          description: The user
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /users:
    get:
      tags: [users]
      summary: Search users by username (you are left out)
      security:
        - bearerAuth: []
      parameters:
        - { name: q, in: query, schema: { type: string }, description: Part of the username }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 50, default: 20 } }
      responses:
        '200':
          description: Matching users
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/PublicUser' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /users/{id}:
    get:
      tags: [users]
      summary: Public data of one user
      parameters:
        - $ref: '#/components/parameters/ID'
      responses:
        '200':
          description: The user
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PublicUser' }
        '404': { $ref: '#/components/responses/NotFound' }

  /users/{id}/reputation:
    get:
      tags: [reputation]
      summary: Public reputation profile
      description: Current reputation, the last 50 changes (oldest first) and the last 20 reviews.
      parameters:
        - $ref: '#/components/parameters/ID'
      responses:
        '200':
          description: The profile
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReputationProfile' }
        '404': { $ref: '#/components/responses/NotFound' }

  /projects:
    get:
      tags: [projects]
      summary: List projects (newest first)
      parameters:
        - { name: status, in: query, schema: { $ref: '#/components/schemas/ProjectStatus' } }
        - { name: category, in: query, schema: { $ref: '#/components/schemas/Category' } }
        - { name: q, in: query, schema: { type: string, maxLength: 100 }, description: Text in the title or description }
        - { name: creator_id, in: query, schema: { type: string, format: uuid } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
        - { name: offset, in: query, schema: { type: integer, minimum: 0, default: 0 } }
      responses:
        '200':
          description: One page of projects
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProjectPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
    post:
      tags: [projects]
      summary: Create a project (scored by the formula, sent to the ML model)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProjectInput' }
      responses:
        '201':
          description: The saved project and the formula's explanation
          content:
            application/json:
              schema:
                type: object
                properties:
                  project: { $ref: '#/components/schemas/Project' }
                  score: { $ref: '#/components/schemas/Score' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /projects/estimate:
    post:
      tags: [projects]
      summary: Score a project without saving it
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProjectInput' }
      responses:
        '200':
          description: The score and its factors
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Score' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /projects/{id}:
    get:
      tags: [projects]
      summary: One project
      parameters:
        - $ref: '#/components/parameters/ID'
      responses:
        '200':
          description: The project
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Project' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [projects]
      summary: Change the title, description or KPIs (creator only, open projects only)
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title: { type: string, minLength: 3, maxLength: 120 }
                description: { type: string, minLength: 10, maxLength: 5000 }
                kpis:
                  type: array
                  items: { $ref: '#/components/schemas/KPI' }
      responses:
        '200':
          description: The updated project
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Project' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /projects/{id}/cancel:
    post:
      tags: [projects]
      summary: Cancel an open project (creator only)
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ID'
      responses:
        '200':
          description: The cancelled project
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Project' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /projects/{id}/prediction:
    get:
      tags: [predictions]
      summary: The formula's estimate next to the ML model's estimate
      parameters:
        - $ref: '#/components/parameters/ID'
      responses:
        '200':
          description: The comparison. `ml` is null while the model has not answered.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PredictionComparison' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [predictions]
      summary: Ask the ML model again (through RabbitMQ)
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ID'
      responses:
        '202':
          description: Sent. The answer arrives a few seconds later.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, enum: [pending] }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/Unavailable' }

  /wallet:
    get:
      tags: [wallet]
      summary: My balance
      security:
        - bearerAuth: []
      responses:
        '200':
          description: The wallet
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Wallet' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /wallet/transactions:
    get:
      tags: [wallet]
      summary: My ledger, newest first
      security:
        - bearerAuth: []
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
        - { name: offset, in: query, schema: { type: integer, minimum: 0, default: 0 } }
      responses:
        '200':
          description: One page of transactions
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Transaction' }
                  total: { type: integer }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /wallet/deposit:
    post:
      tags: [wallet]
      summary: Add test money (development mode only)
      description: The route does not exist when APP_ENV is not "development" (404).
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amount]
              properties:
                amount: { type: integer, format: int64, minimum: 1, maximum: 100000000, description: 'Kopecks, at most 1 000 000 rubles' }
      responses:
        '200':
          description: The new balance
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Wallet' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /swaps/calculate:
    post:
      tags: [swaps]
      summary: Calculate the terms of a swap without saving it
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SwapProposal' }
      responses:
        '200':
          description: The terms
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SwapCalculation' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /swaps:
    post:
      tags: [swaps]
      summary: Propose a swap (party A = the project creator)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SwapProposal' }
      responses:
        '201':
          description: The proposed swap
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Swap' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
    get:
      tags: [swaps]
      summary: My swaps (as party A or B)
      security:
        - bearerAuth: []
      parameters:
        - { name: status, in: query, schema: { $ref: '#/components/schemas/SwapStatus' } }
      responses:
        '200':
          description: The swaps
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Swap' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /swaps/{id}:
    get:
      tags: [swaps]
      summary: One swap (parties only; 404 for anyone else)
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ID'
      responses:
        '200':
          description: The swap
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Swap' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /swaps/{id}/accept:
    post:
      tags: [swaps]
      summary: Accept (party B). Both guarantees are frozen in one transaction.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ID'
      responses:
        '200': { $ref: '#/components/responses/SwapOK' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /swaps/{id}/reject:
    post:
      tags: [swaps]
      summary: Reject a proposal (party B)
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ID'
      responses:
        '200': { $ref: '#/components/responses/SwapOK' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /swaps/{id}/cancel:
    post:
      tags: [swaps]
      summary: Cancel
      description: |
        A proposed swap is cancelled at once by party A. An active swap is cancelled
        only when both parties ask; then both guarantees are returned in full.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ID'
      responses:
        '200': { $ref: '#/components/responses/SwapOK' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /swaps/{id}/outcome:
    post:
      tags: [swaps]
      summary: Report the result of the project (either party)
      description: |
        The money moves only when both answers are the same:
        both "success" = guarantees returned minus the 0.5% fee;
        both "failure" = each guarantee (minus the fee) goes to the other party.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [outcome]
              properties:
                outcome: { $ref: '#/components/schemas/Outcome' }
      responses:
        '200': { $ref: '#/components/responses/SwapOK' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /swaps/{id}/review:
    post:
      tags: [reputation]
      summary: Review the other party of a finished swap (once per swap)
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [rating]
              properties:
                rating: { type: integer, minimum: 1, maximum: 5 }
                comment: { type: string, maxLength: 1000 }
      responses:
        '201':
          description: The saved review
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Review' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    refreshCookie:
      type: apiKey
      in: cookie
      name: refresh_token

  parameters:
    ID:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }

  headers:
    RefreshCookie:
      description: 'refresh_token=...; Path=/api/auth; HttpOnly; SameSite=Strict'
      schema: { type: string }

  responses:
    BadRequest:
      description: Invalid input (`field` names the wrong field)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unauthorized:
      description: Missing, wrong or expired token or password
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: Logged in, but not allowed
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: Not found
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Conflict:
      description: Clashes with the current state (status, duplicate, not enough money)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    TooManyRequests:
      description: Too many attempts, try again in a minute
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unavailable:
      description: The ML service is not available
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    SwapOK:
      description: The updated swap
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Swap' }

  schemas:
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code: { type: integer, example: 409 }
            message: { type: string, example: email is already registered }
            field: { type: string, example: password }

    Health:
      type: object
      properties:
        status: { type: string, enum: [ok, degraded] }
        service: { type: string }
        version: { type: string }
        database: { type: string, enum: [up, down] }
        time: { type: string, format: date-time }
        uptime_seconds: { type: integer }

    Role: { type: string, enum: [developer, designer, manager, other] }
    Category: { type: string, enum: [web, mobile, design, marketing, other] }
    ProjectStatus: { type: string, enum: [open, in_progress, completed, failed, cancelled] }
    SwapStatus: { type: string, enum: [proposed, active, completed, failed, cancelled, rejected] }
    Outcome: { type: string, enum: [success, failure] }

    RegisterInput:
      type: object
      required: [username, email, password, role]
      properties:
        username: { type: string, pattern: '^[a-zA-Z0-9_]{3,32}$', example: ali_test }
        email: { type: string, format: email, example: ali@example.com }
        password: { type: string, minLength: 8, maxLength: 72, example: secret123 }
        role: { $ref: '#/components/schemas/Role' }

    LoginInput:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email, example: ali@example.com }
        password: { type: string, example: secret123 }

    User:
      type: object
      properties:
        id: { type: string, format: uuid }
        username: { type: string }
        email: { type: string }
        role: { $ref: '#/components/schemas/Role' }
        reputation_bp: { type: integer }
        created_at: { type: string, format: date-time }

    PublicUser:
      type: object
      description: What anyone may see about a user (no email)
      properties:
        id: { type: string, format: uuid }
        username: { type: string }
        role: { $ref: '#/components/schemas/Role' }
        reputation_bp: { type: integer }
        created_at: { type: string, format: date-time }

    AuthResponse:
      type: object
      properties:
        access_token: { type: string }
        token_type: { type: string, enum: [Bearer] }
        expires_in: { type: integer, description: Seconds }
        user: { $ref: '#/components/schemas/User' }

    KPI:
      type: object
      required: [name, target, weight]
      properties:
        name: { type: string, maxLength: 100 }
        target: { type: string, maxLength: 200 }
        weight: { type: integer, minimum: 1, maximum: 100, description: All weights of a project add up to 100 }

    ProjectInput:
      type: object
      required: [title, description, category, budget, duration_days, complexity, team_size]
      properties:
        title: { type: string, minLength: 3, maxLength: 120, example: Online shop }
        description: { type: string, minLength: 10, maxLength: 5000, example: A small online shop for handmade goods. }
        category: { $ref: '#/components/schemas/Category' }
        budget: { type: integer, format: int64, minimum: 10000, maximum: 100000000000, description: Kopecks, example: 15000000 }
        duration_days: { type: integer, minimum: 1, maximum: 3650, example: 60 }
        complexity: { type: integer, minimum: 1, maximum: 10, example: 5 }
        team_size: { type: integer, minimum: 1, maximum: 100, example: 2 }
        kpis:
          type: array
          maxItems: 10
          items: { $ref: '#/components/schemas/KPI' }

    Project:
      type: object
      properties:
        id: { type: string, format: uuid }
        creator:
          type: object
          properties:
            id: { type: string, format: uuid }
            username: { type: string }
        title: { type: string }
        description: { type: string }
        category: { $ref: '#/components/schemas/Category' }
        budget: { type: integer, format: int64 }
        duration_days: { type: integer }
        complexity: { type: integer }
        team_size: { type: integer }
        kpis:
          type: array
          items: { $ref: '#/components/schemas/KPI' }
        success_probability_bp: { type: integer }
        status: { $ref: '#/components/schemas/ProjectStatus' }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    ProjectPage:
      type: object
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Project' }
        total: { type: integer }
        limit: { type: integer }
        offset: { type: integer }

    Score:
      type: object
      properties:
        score_bp: { type: integer }
        success_probability_bp: { type: integer, description: 5% to 95% }
        factors:
          type: array
          items:
            type: object
            properties:
              name: { type: string, example: account_age }
              points: { type: integer, example: -1000 }

    PredictionComparison:
      type: object
      properties:
        project_id: { type: string, format: uuid }
        status: { type: string, enum: [ready, pending] }
        formula:
          type: object
          properties:
            success_probability_bp: { type: integer }
        ml:
          type: object
          nullable: true
          properties:
            success_probability_bp: { type: integer }
            model_version: { type: string, example: rf-1 }
            updated_at: { type: string, format: date-time }
        difference_bp: { type: integer, nullable: true, description: ml minus formula }

    Wallet:
      type: object
      properties:
        balance: { type: integer, format: int64, description: Kopecks the user can use }
        frozen_balance: { type: integer, format: int64, description: Kopecks locked in active swaps }
        updated_at: { type: string, format: date-time }

    Transaction:
      type: object
      properties:
        id: { type: integer }
        swap_id: { type: string, format: uuid, nullable: true }
        type: { type: string, enum: [deposit, escrow_lock, escrow_release, penalty_paid, penalty_received, fee] }
        amount: { type: integer, format: int64 }
        balance_after: { type: integer, format: int64 }
        frozen_after: { type: integer, format: int64 }
        description: { type: string }
        created_at: { type: string, format: date-time }

    SwapProposal:
      type: object
      required: [project_id, partner_id]
      properties:
        project_id: { type: string, format: uuid }
        partner_id: { type: string, format: uuid, description: The user who becomes party B }
        party_a_role: { $ref: '#/components/schemas/Role' }
        party_b_role: { $ref: '#/components/schemas/Role' }

    RiskProfile:
      type: object
      properties:
        max_gain: { type: integer, format: int64 }
        max_loss: { type: integer, format: int64 }
        expected_value: { type: integer, format: int64 }

    SwapTerms:
      type: object
      properties:
        share_a_bp: { type: integer }
        share_b_bp: { type: integer }
        escrow_amount: { type: integer, format: int64 }
        penalty_a: { type: integer, format: int64, description: Guarantee of party A }
        penalty_b: { type: integer, format: int64, description: Guarantee of party B }
        success_probability_bp: { type: integer }
        risk_a: { $ref: '#/components/schemas/RiskProfile' }
        risk_b: { $ref: '#/components/schemas/RiskProfile' }

    SwapParty:
      type: object
      properties:
        id: { type: string, format: uuid }
        username: { type: string }
        role: { $ref: '#/components/schemas/Role' }

    SwapCalculation:
      type: object
      properties:
        project:
          type: object
          properties:
            id: { type: string, format: uuid }
            title: { type: string }
        party_a: { $ref: '#/components/schemas/SwapParty' }
        party_b: { $ref: '#/components/schemas/SwapParty' }
        terms: { $ref: '#/components/schemas/SwapTerms' }

    Swap:
      allOf:
        - $ref: '#/components/schemas/SwapCalculation'
        - type: object
          properties:
            id: { type: string, format: uuid }
            status: { $ref: '#/components/schemas/SwapStatus' }
            outcome_a: { type: string, enum: [success, failure], nullable: true }
            outcome_b: { type: string, enum: [success, failure], nullable: true }
            cancel_requested_by: { type: string, format: uuid, nullable: true }
            accepted_at: { type: string, format: date-time, nullable: true }
            deadline_at: { type: string, format: date-time, nullable: true }
            closed_at: { type: string, format: date-time, nullable: true }
            created_at: { type: string, format: date-time }

    Reputation:
      type: object
      properties:
        score_bp: { type: integer }
        completed_count: { type: integer }
        failed_count: { type: integer }
        cancelled_count: { type: integer }
        success_rate_bp: { type: integer }
        avg_rating_x100: { type: integer, nullable: true, description: '100..500, null = no reviews' }
        avg_budget: { type: integer, format: int64 }
        total_volume: { type: integer, format: int64 }
        trust_weight_bp: { type: integer }
        reason: { type: string, example: swap_completed }
        updated_at: { type: string, format: date-time }

    Review:
      type: object
      properties:
        id: { type: string, format: uuid }
        swap_id: { type: string, format: uuid }
        author:
          type: object
          properties:
            id: { type: string, format: uuid }
            username: { type: string }
        rating: { type: integer, minimum: 1, maximum: 5 }
        comment: { type: string }
        created_at: { type: string, format: date-time }

    ReputationProfile:
      type: object
      properties:
        user: { $ref: '#/components/schemas/PublicUser' }
        reputation: { $ref: '#/components/schemas/Reputation' }
        history:
          type: array
          items:
            type: object
            properties:
              score_bp: { type: integer }
              reason: { type: string }
              created_at: { type: string, format: date-time }
        reviews:
          type: array
          items: { $ref: '#/components/schemas/Review' }